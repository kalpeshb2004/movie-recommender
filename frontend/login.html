<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - MovieFlix</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-box { max-width: 360px; margin: 100px auto; background: rgba(0,0,0,0.75); padding: 40px; border-radius: 6px; }
  .auth-box h2 { margin-bottom: 20px; }
  .auth-box input { width: 100%; padding: 12px; margin-bottom: 14px; background: #333; border: none; border-radius: 4px; color: #fff; }
  .auth-box button { width: 100%; padding: 12px; background: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .switch-link { margin-top: 14px; color: #999; font-size: 14px; }
  .switch-link a { color: #fff; }
  #auth-error { color: #e87c03; margin-bottom: 10px; font-size: 14px; }
</style>
</head>
<body>

<a href="index.html" class="logo" style="position:absolute; top:20px; left:40px; color:#e50914; font-size:24px; font-weight:bold; text-decoration:none;">MOVIEFLIX</a>

<div class="auth-box">
  <h2 id="form-title">Sign In</h2>
  <div id="auth-error"></div>

  <form id="login-form">
    <input id="li-email" type="email" placeholder="Email" required>
    <input id="li-password" type="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>

  <form id="signup-form" style="display:none;">
    <input id="su-username" type="text" placeholder="Username" required>
    <input id="su-email" type="email" placeholder="Email" required>
    <input id="su-password" type="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>

  <div class="switch-link">
    <span id="switch-text">New here?</span>
    <a href="#" id="switch-link">Sign up now</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  const switchLink = document.getElementById("switch-link");
  const switchText = document.getElementById("switch-text");
  const formTitle = document.getElementById("form-title");
  let showingLogin = true;

  switchLink.addEventListener("click", (e) => {
    e.preventDefault();
    showingLogin = !showingLogin;
    loginForm.style.display = showingLogin ? "block" : "none";
    signupForm.style.display = showingLogin ? "none" : "block";
    formTitle.textContent = showingLogin ? "Sign In" : "Sign Up";
    switchText.textContent = showingLogin ? "New here?" : "Already have an account?";
    switchLink.textContent = showingLogin ? "Sign up now" : "Sign in";
  });
</script>
</body>
</html>
